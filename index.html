<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:#e8eef7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:22px 18px;background:#0c1828;border-bottom:1px solid #26364a}
header h1{margin:0;font-size:25px;letter-spacing:2px}
header p{color:#9aacc2;font-size:13px;margin-bottom:0}
main{max-width:1500px;padding:16px;margin:auto}
.notice{background:#332d18;border:1px solid #e6b84c;color:#f5d77d;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat,.panel{background:#111f31;border:1px solid #26364a;border-radius:10px;padding:14px;min-width:0}
.panel{margin-top:14px}
.stat-label{color:#9aacc2;font-size:11px;text-transform:uppercase}
.stat-value{font-size:23px;font-weight:bold;margin-top:8px;overflow-wrap:anywhere}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
button,select,input{background:#17283d;color:#dce7f5;border:1px solid #40536b;border-radius:7px;padding:9px 12px;font:inherit;font-size:13px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:#74baff}
button:disabled{opacity:.5;cursor:wait}
button.active{background:#1764a5;border-color:#3999e8;color:#fff}
input{min-width:180px}
:focus-visible{outline:2px solid #74baff;outline-offset:2px}
.status{color:#a8bbd0;font-size:12px;margin:6px 0;line-height:1.5}
#map{height:58vh;min-height:340px;border-radius:10px;border:1px solid #26364a;overflow:hidden}
.bottom,.geo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
h2{font-size:16px;margin:14px 0 6px}
.panel>h2:first-child{margin-top:0}
.list{max-height:330px;overflow-y:auto}
.event{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #26364a;border-radius:0;padding:9px 0;font-size:13px;line-height:1.5;color:inherit}
.event:hover{background:#17283d}
.mag{display:inline-block;min-width:44px;text-align:center;border-radius:5px;padding:1px 6px;margin-right:8px;font-weight:bold;color:#08111f;font-size:12px}
.muted{color:#9aacc2;font-size:12px;line-height:1.6}
a{color:#74baff}
.news-list{display:flex;flex-direction:column;gap:10px}
.news-card{background:#0d1a2a;border:1px solid #2b3c52;border-radius:9px;padding:12px}
.news-card h3{font-size:14px;line-height:1.45;margin:0 0 8px}
.news-meta{font-size:11px;color:#9aacc2;line-height:1.5;margin-bottom:8px}
.news-card p{font-size:12px;color:#c4d0df;line-height:1.5;margin:0 0 8px}
.news-card a{font-size:12px;margin-right:10px;display:inline-block}
.tag{display:inline-block;border:1px solid #53647a;border-radius:20px;padding:3px 8px;font-size:10px;color:#c6d5e7;margin:0 5px 6px 0}
.tag.confirm{border-color:#b58a3a;color:#ffd58b}
.tag.impact{border-color:#3d8f7a;color:#8fe0c8}
.alert-critical{border-color:#ff5252;color:#ff8a80;background:#3a171b}
.alert-high{border-color:#ff9f43;color:#ffc078;background:#382515}
.alert-moderate{border-color:#e6b84c;color:#f5d77d;background:#332d18}
.alert-info{border-color:#6686a8;color:#b8cde3;background:#17283d}
.alert-card{border-left:4px solid #6686a8}
.alert-card.critical{border-left-color:#ff5252}
.alert-card.high{border-left-color:#ff9f43}
.alert-card.moderate{border-left-color:#e6b84c}
.alert-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.alert-count{background:#0d1a2a;border:1px solid #2b3c52;border-radius:8px;padding:10px;text-align:center}
.alert-count strong{display:block;font-size:21px;margin-bottom:4px}
.alert-count span{font-size:10px;color:#9aacc2;text-transform:uppercase}
.history-item{padding:9px 0;border-bottom:1px solid #26364a;font-size:12px;line-height:1.5}
.empty{color:#9aacc2;font-size:13px;padding:12px 0}
.skel{height:64px;border-radius:9px;background:linear-gradient(90deg,#0d1a2a 25%,#17283d 50%,#0d1a2a 75%);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
.map-legend{display:flex;flex-wrap:wrap;gap:10px;margin:9px 0 2px;color:#b7c6d8;font-size:11px}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.sig{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;width:100%;margin:4px 0;text-align:left}
.track{display:block;background:#0d1a2a;border-radius:5px;height:10px;overflow:hidden}
